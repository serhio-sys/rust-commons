[package]
name = "rust-commons"
description = "Rust commons"
version = "0.1.0"
edition = "2021"
authors = ["Serhii Kolodiazhnyi <serhii.kolodyazhniy@gmail.com>"]
publish = ["local"]

readme = "README.md"
license = "Apache-2.0"

[dependencies]
diesel = { version = "2.2.0", features = ["postgres", "chrono", "uuid", "r2d2"] }
diesel_migrations = { version = "2.2.0" }
chrono = { version = "0.4.38", features = ["serde"] }

dotenvy = "0.15.7"
lazy_static = "1.5.0"
log = "0.4.22"
pwhash = "1.0.0"
base64 = "0.22.1"
uuid = { version = "1.2", features = ["v4", "serde"] }
rand = "0.8.5"
thiserror = "2.0.7"

# Json serialization
serde_qs = { version = "0.13", features = ["actix4"] }
serde_urlencoded = "0.7"
serde_json = "1.0"
